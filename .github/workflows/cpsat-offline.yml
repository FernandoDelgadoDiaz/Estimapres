name: AH2 CP-SAT offline benchmark (experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/cpsat/**'
      - 'src/algoritmo/__tests__/cpsat.export.test.ts'
      - '.github/workflows/cpsat-offline.yml'

permissions:
  contents: read

jobs:
  cpsat-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tools/cpsat/requirements.txt'
      - name: Install standalone solver
        run: python -m pip install -r tools/cpsat/requirements.txt
      - name: Offline unit tests (no Supabase / Netlify)
        run: python -m unittest discover -s tools/cpsat -p 'test_*.py' -v
